
# Spring Boot Application Configuration
spring.application.name=sentiment-ledger
spring.main.allow-bean-definition-overriding=true

#*******************PHASE 1 CONFIGURATION - Database*******************

#Mongo DB Configuration
#spring.data.mongodb.uri=mongodb://localhost:27017/sentiment_ledger
spring.data.mongodb.uri=mongodb+srv://<user-name>:<password>@cluster0.ntpeic2.mongodb.net/sentiment_ledger?retryWrites=true&w=majority&appName=Cluster0

# logging configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoOperations=DEBUG
logging.level.org.springframework.data.mongodb.core.query=DEBUG
logging.level.org.mongodb.driver.protocol.command=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.com.daya.project.sentiment_ledger=DEBUG

#logging.pattern.console=%green(%d{yyyy-MM-dd HH:mm:ss.SSS}) %highlight(%-5level) %magenta(%logger{36}) - %msg%n

logging.pattern.console=%green(%d{yyyy-MM-dd HH:mm:ss.SSS}) \
%highlight(%-5level) \
%magenta(%-40.40logger{36}) \
: %msg%n

#*******************PHASE 2 CONFIGURATION - Kafka*******************

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer properties
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#*******************PHASE 3 CONFIGURATION - Redis*******************

# ===============================
# REDIS CONFIGURATION
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

#*******************PHASE 4 CONFIGURATION - AI*******************

# ============================================
# GOOGLE GEMINI CONFIGURATION
# ============================================
spring.ai.google.genai.api-key=<your-api-key>
spring.ai.google.genai.embedding.api-key=<your-api-key>
spring.ai.google.genai.project-id=gen-lang-client-0733393669
spring.ai.google.genai.embedding.options.model=embedding-001

# Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=1000
spring.ai.google.genai.chat.options.top-p=0.95
spring.ai.google.genai.chat.options.top-k=40

#===============================================
# SENTIMENT LEDGER CONFIGURATION
#===============================================
sentiment-ledger.search.top-k=2
sentiment-ledger.search.similarity-threshold=0.0

# ============================================
# MONGODB ATLAS VECTOR STORE CONFIGURATION
# ============================================
spring.ai.vectorstore.mongodb.initialize-schema=true
spring.ai.vectorstore.mongodb.collection-name=vector_store
spring.ai.vectorstore.mongodb.index-name=vector_index

# ============================================
# Actuator & Metrics
# ============================================
management.endpoints.web.exposure.include=metrics,prometheus,health,info
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
spring.task.scheduling.pool.size=2
management.health.circuitbreakers.enabled=true

# ============================================
# RESILIENCE
# ============================================

# Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=2000ms
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.recordExceptions=java.lang.Exception

# Payment Service Circuit Breaker
resilience4j.circuitbreaker.instances.payment-service.baseConfig=default
resilience4j.circuitbreaker.instances.payment-service.failureRateThreshold=50

# Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1000ms
resilience4j.retry.configs.default.interval-function=exponential
resilience4j.retry.configs.default.multiplier=2.0

# Payment Service Retry
resilience4j.retry.instances.payment-retry.baseConfig=default
resilience4j.retry.instances.payment-retry.max-attempts=3