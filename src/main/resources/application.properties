spring.application.name=sentiment-ledger

#*******************PHASE 1 CONFIGURATION*******************

# ============================================
# GOOGLE GEMINI CONFIGURATION
# ============================================
spring.ai.google.genai.api-key=${SL_API_KEY}
spring.ai.google.genai.embedding.api-key=${SL_API_KEY}
spring.ai.google.genai.project-id=gen-lang-client-0733393669
spring.ai.google.genai.embedding.options.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.model=text-embedding-004


# Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=1000
spring.ai.google.genai.chat.options.top-p=0.95
spring.ai.google.genai.chat.options.top-k=40


#Mongo DB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/sentiment_ledger

# logging configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoOperations=DEBUG
logging.level.org.springframework.data.mongodb.core.query=DEBUG
logging.level.org.mongodb.driver.protocol.command=DEBUG


#*******************PHASE 2 CONFIGURATION*******************

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer properties
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer properties
spring.kafka.consumer.group-id=ledger-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=invoice:com.daya.project.sentiment_ledger.model.Invoice

#*******************PHASE 3 CONFIGURATION*******************

# ===============================
# REDIS CONFIGURATION
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379