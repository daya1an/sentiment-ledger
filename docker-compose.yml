services:
  # 1. MongoDB
  mongodb:
    image: mongo:latest
    container_name: sl-mongo
    ports:
      - "27017:27017"

  # 2. Redis
  redis:
    image: redis:latest
    container_name: sl-redis
    ports:
      - "6379:6379"

  # 3. Kafka (Official Apache Image with Dual Listeners)
  kafka:
    image: apache/kafka:latest
    container_name: sl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Dual Listeners: INTERNAL (Port 29092) for Docker UI, EXTERNAL (Port 9092) for Spring Boot
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://sl-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # 4. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sl-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Local-Sentient-Cluster
      # UI connects to the INTERNAL port using the exact container name
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: sl-kafka:29092
    depends_on:
      - kafka